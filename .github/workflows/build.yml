name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish as a GitHub release (leave empty to just build)"
        required: false
        type: string

jobs:
  build:
    name: Build ${{ matrix.label }}-${{ matrix.arch }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-2022
            label: windows
            arch: x64
            triplet: x64-windows

          - os: windows-2022
            label: windows
            arch: arm64
            triplet: arm64-windows

          - os: ubuntu-24.04
            label: linux
            arch: x64
            triplet: x64-linux

          - os: ubuntu-24.04-arm
            label: linux
            arch: arm64
            triplet: arm64-linux

          - os: macos-15
            label: macos
            arch: arm64
            triplet: arm64-osx

          - os: macos-15
            label: macos
            arch: x64
            triplet: arm64-osx

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ~3.31.0
          ninjaVersion: latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: ${{ runner.workspace }}/vcpkg
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Dump workspace before build
        shell: bash
        run: find $RUNNER_WORKSPACE

      - name: Print output of "run-vcpkg"
        run: echo "root='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}'"

      - name: Configure and build plug-in
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/CMakeLists.txt
          configurePreset: release-${{ matrix.label }}-${{ matrix.arch }}
          buildPreset: release-${{ matrix.label }}-${{ matrix.arch }}

      - name: Dump workpace after build
        shell: bash
        run: find $RUNNER_WORKSPACE

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: Nuked-SC55-CLAP-${{ matrix.label }}-${{ matrix.arch }}
          path: build/release-${{ matrix.label }}-${{ matrix.arch }}/Nuked-SC55.clap

  build-macos-package:
    name:    Create macOS universal package
    needs:   build
    runs-on: macos-15
    steps:
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: Nuked-SC55-CLAP-macos-*

      - name: Dump workspace
        shell: bash
        run: find $RUNNER_WORKSPACE

      - name: Create universal binary
        run: |
          set -x

          mkdir -p "out/Nuked-SC55.clap"

          X64_EXE="Nuked-SC55-CLAP-macos-x64/Contents/MacOS/Nuked-SC55"
          ARM64_EXE="Nuked-SC55-CLAP-macos-arm64/Contents/MacOS/Nuked-SC55"

          lipo "$X64_EXE" "$ARM64_EXE" -create -output Nuked-SC55-universal

          mv Nuked-SC55-CLAP-macos-arm64/Contents out/Nuked-SC55.clap
          mv -f Nuked-SC55-universal out/Nuked-SC55.clap/Contents/MacOS/Nuked-SC55


      - name: Verify universal binary
        run: |
          ARCHS=$(lipo -archs out/Nuked-SC55.clap/Contents/MacOS/Nuked-SC55)

          if [[ "$ARCHS" == "x86_64 arm64" ]]; then
            echo "Success! Universal binary app bundle is in 'out/Nuked-SC55.clap'"
          else
            echo "Oops, something went wrong. Arch of the CLAP plugin is '$ARCHS'"
            exit 1
          fi


      - name: Dump workspace
        shell: bash
        run: find $RUNNER_WORKSPACE

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: Nuked-SC55-CLAP-macos-universal
          path: out

  release:
    name:    Publish release
    needs:   [build, build-macos-package]
    if:      github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Dump workspace
        run: find artifacts

      - name: Package release assets
        run: |
          set -xe

          mkdir -p release
          TAG="${{ inputs.release_tag }}"

          # Matches the upstream johnnovak/Nuked-SC55-CLAP release asset
          # naming/zip layout exactly (a zip containing just the .clap
          # plugin at its root), since dosbox-staging's own CI already
          # knows how to download and unpack that exact format -- it just
          # needs pointing at this fork's releases instead.
          declare -A dirs=(
            ["linux-x86_64"]="Nuked-SC55-CLAP-linux-x64"
            ["linux-arm64"]="Nuked-SC55-CLAP-linux-arm64"
            ["windows-x64"]="Nuked-SC55-CLAP-windows-x64"
            ["windows-arm64"]="Nuked-SC55-CLAP-windows-arm64"
          )

          for asset_arch in "${!dirs[@]}"; do
            src="artifacts/${dirs[$asset_arch]}/Nuked-SC55.clap"
            zip -j "release/Nuked-SC55-CLAP-${asset_arch}-${TAG}.zip" "$src"
          done

          # macOS CLAP plugins are bundles (directories), so zip the whole
          # bundle directory (not just its contents) to match upstream.
          (cd artifacts/Nuked-SC55-CLAP-macos-universal && \
            zip -r "$GITHUB_WORKSPACE/release/Nuked-SC55-CLAP-macOS-${TAG}.zip" Nuked-SC55.clap)

          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: release/*
          body: |
            Automated build of the `lcd-framebuffer` fork branch, adding a
            custom CLAP extension that exposes the emulated LCD as a raw
            pixel buffer for use with
            [senjinthedragon/dosbox-staging](https://github.com/senjinthedragon/dosbox-staging)'s
            LCD overlay feature.

            The Windows/macOS builds haven't been manually tested by the
            fork maintainer yet - please report any issues.

